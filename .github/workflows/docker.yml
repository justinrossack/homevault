# Baut die Docker-Images für x86_64 und ARM64 und lädt sie in die
# GitHub Container Registry (ghcr.io). Jede Architektur wird auf eigener
# Hardware gebaut (schneller als Emulation), danach werden beide zu einem
# Image zusammengefasst.
#
#   Push auf main      -> :latest und :sha-<commit>
#   Tag v1.2.3         -> :1.2.3, :1.2, :1 und :latest
#   Pull Request       -> nur bauen (Test), nichts hochladen
name: Docker-Images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: homevault, context: ., target: "" }
          - { name: homevault-disks, context: ., target: disks }
          - { name: homevault-samba, context: ./samba, target: "" }
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Image-Name festlegen (klein geschrieben)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen (und hochladen, außer bei Pull Requests)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          # verknüpft das Paket auf ghcr.io mit diesem Repository
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}

      - name: Digest merken
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          # doppelter Bindestrich: „homevault--*“ passt nicht auf „homevault-disks--*“
          name: digest-${{ matrix.image.name }}--${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: ${{ matrix.image }} veröffentlichen
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [homevault, homevault-disks, homevault-samba]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}--*
          merge-multiple: true

      - name: Image-Name festlegen
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: latest=auto

      - name: x86_64- und ARM64-Image zusammenfassen
        working-directory: /tmp/digests
        run: |
          args=()
          while read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # ghcr.io liest die Verknüpfung zum Repository aus dem Index
          args+=(--annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      - name: Ergebnis anzeigen
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
