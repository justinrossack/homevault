# Konfiguration in .env (Vorlage: .env.example)
# Nutzt die fertigen Images von GitHub. Aus dem Quellcode bauen:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  homevault:
    image: ghcr.io/justinrossack/homevault:${HOMEVAULT_VERSION:-latest}
    container_name: ${CONTAINER_PREFIX:-homevault}
    user: "${PUID:-1000}:${PGID:-1000}"
    # im Netzwerk des Servers: sieht alle Netzwerkadapter, damit Backup und
    # Sync über einen bestimmten Adapter laufen können (pro NAS einstellbar)
    network_mode: host
    # Beim ersten Aufruf im Browser startet der Einrichtungsassistent
    # (Admin-Konto, Servername, Festplatten, weitere Benutzer).
    environment:
      PORT: ${WEB_PORT:-8080}
      # Zeitzone für Backup-Zeitpläne
      TZ: ${TZ:-Europe/Berlin}
      INDEX_INTERVAL_MINUTES: ${INDEX_INTERVAL_MINUTES:-10}
      # optional: ersten Admin ohne Assistent anlegen
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Platten-Dienst und KI sind nur auf dem Server selbst erreichbar (127.0.0.1)
      DISK_AGENT_URL: ${DISK_AGENT_URL:+http://127.0.0.1:8091}
      DISK_AGENT_TOKEN: ${DISK_AGENT_TOKEN:-}
      # optional: lokale KI für den Eingangs-Ordner (Dokumente benennen/sortieren)
      AI_URL: ${AI_URL:+http://127.0.0.1:11434}
      AI_MODEL: ${AI_MODEL:-qwen2.5:3b}
    volumes:
      # rslave: sieht den Speicherverbund, sobald der Platten-Dienst ihn einhängt
      - ${MEDIA_DIR:?MEDIA_DIR in .env setzen}:/data:${MEDIA_PROPAGATION:-rw}
      - cache:/cache
      # Intel Quick Sync für die Video-Umwandlung. Ohne Grafik-Hardware wird
      # einfach per Software umgewandelt.
      - /dev/dri:/dev/dri
    device_cgroup_rules:
      - "c 226:* rmw"
    group_add:
      # Gruppe „render“ des Servers (getent group render)
      - "${RENDER_GID:-992}"
    depends_on:
      disks:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # Gleiche Ordner und Logins als Netzlaufwerk (Windows-Explorer, macOS Finder, Dateien-App)
  samba:
    image: ghcr.io/justinrossack/homevault-samba:${HOMEVAULT_VERSION:-latest}
    container_name: ${CONTAINER_PREFIX:-homevault}-smb
    ports:
      - "${SMB_PORT:-445}:445"
    depends_on:
      homevault:
        condition: service_started
      disks:
        condition: service_healthy
        required: false
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # wartet mit der Freigabe, bis der Speicherverbund eingehängt ist
      DISK_AGENT_URL: ${DISK_AGENT_URL:+http://disks:8091}
    volumes:
      - ${MEDIA_DIR}:/data:${MEDIA_PROPAGATION:-rw}
    restart: unless-stopped

  # Optional: Festplatten-Verwaltung (Spiegel/RAID, Hot-Swap).
  # Einschalten mit COMPOSE_PROFILES=disks in der .env (siehe .env.example).
  disks:
    image: ghcr.io/justinrossack/homevault-disks:${HOMEVAULT_VERSION:-latest}
    profiles: ["disks"]
    privileged: true
    # um Systemplatten des Servers sicher zu erkennen
    pid: host
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      DISK_AGENT_TOKEN: ${DISK_AGENT_TOKEN:-}
      DISK_TEST_LOOP_DIR: ${DISK_TEST_LOOP_DIR:-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - /dev:/dev
      # rshared: hier eingehängter Speicher wird für den Server und die anderen Container sichtbar
      - ${MEDIA_DIR}:/data:rshared
      - disks-state:/state
    restart: unless-stopped

  # Optional: lokale KI (Ollama) für den Eingangs-Ordner. Läuft komplett im
  # Haus, braucht ca. 3 GB RAM und 2 GB Platz für das Modell.
  # Einschalten mit COMPOSE_PROFILES=ai (bzw. disks,ai) und AI_URL in der .env.
  ai:
    image: ollama/ollama:0.6.8
    profiles: ["ai"]
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ai-models:/root/.ollama
    # Ollama rechnet nur auf den echten Kernen (ohne Hyperthreading), so
    # bleibt für Uploads und Videos Luft
    restart: unless-stopped

volumes:
  cache:
  disks-state:
  ai-models:
